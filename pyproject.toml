[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "daming-agent"
version = "1.0.0"
description = "Industrial-Grade Universal Autonomous AI Agent Framework with Mid-flight Steering, Hashline Edits, Auto Failover & 4 Cognitive Engines"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai-agent", "llm", "autonomous-agent", "taskgraph", "failover", "feishu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "PyYAML>=6.0.1",
    "lark-oapi>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "prompt_toolkit>=3.0.52,<4.0",
]

[project.urls]
Homepage = "https://github.com/dylanma8232-art/Daming-Agent"
Issues = "https://github.com/dylanma8232-art/Daming-Agent/issues"

[project.scripts]
daming-agent = "app:main"

[tool.setuptools.packages.find]
where = ["src"]

